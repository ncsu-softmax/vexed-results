<title>VEXED Core Model Comparison</title>
<meta name="description" content="Five Claude models on the VEXED core benchmark: exploit-verified vulnerability detection on 207 C/C++ CVEs.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* Layout: one centered column of cards; tiles and paired cards wrap to one column on phones. */
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --fg: #18202b; --muted: #5b6574; --line: #dfe3e9; --grid: #eceff3;
    --ok: #1f8a5b; --warn: #c27a12; --bad: #c8423b; --none: #a3abb6; --accent: #2c5fbf;
    --m0: #2c5fbf; --m1: #d9762b; --m2: #2a9187; --m3: #8b5cc9; --m4: #7a8494;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --font-display: "Newsreader", Georgia, "Songti SC", serif;
    --radius: 8px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151b; --panel: #181e26; --fg: #e6eaf0; --muted: #9aa4b2; --line: #2a323d; --grid: #222a34;
      --ok: #4cc28a; --warn: #e3a447; --bad: #ec6a62; --none: #5d6673; --accent: #7aa2f0;
      --m0: #7aa2f0; --m1: #f0a066; --m2: #5cc4b9; --m3: #b794ec; --m4: #a3adbb;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151b; --panel: #181e26; --fg: #e6eaf0; --muted: #9aa4b2; --line: #2a323d; --grid: #222a34;
    --ok: #4cc28a; --warn: #e3a447; --bad: #ec6a62; --none: #5d6673; --accent: #7aa2f0;
    --m0: #7aa2f0; --m1: #f0a066; --m2: #5cc4b9; --m3: #b794ec; --m4: #a3adbb;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin-inline: auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 4vw, 40px); line-height: 1.15; margin: 0; text-wrap: balance; }
  .lede { margin: 10px 0 0; font-size: 17px; max-width: 68ch; }
  .lede b { font-weight: 600; }
  .meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; max-width: 90ch; }
  .meta code { font-family: var(--font-data); font-size: 12px; }
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
  .switch button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 6px 14px; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
  .tile h3 { margin: 0; font-size: 13px; font-weight: 500; display: flex; gap: 6px; align-items: center; }
  .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--sw); flex: none; display: inline-block; }
  .big { font-family: var(--font-display); font-size: 34px; line-height: 1.1; margin: 0; }
  .sub { margin: 0; font-size: 12.5px; color: var(--muted); }
  .pair { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
  .card h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .note { margin: 0; color: var(--muted); font-size: 13px; max-width: 80ch; }
  .chart { position: relative; min-height: 120px; }
  .chart svg { display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
  .chart .strong { fill: var(--fg); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .scroll { overflow: auto; max-height: 560px; }
  .heat, .mx { display: grid; gap: 2px; font-size: 13px; }
  .heat { min-width: 560px; }
  .mx { min-width: 480px; }
  .heat > div, .mx > div { padding: 5px 8px; white-space: nowrap; border-radius: 3px; }
  .hh { color: var(--muted); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .hc { text-align: center; font-family: var(--font-data); font-size: 12.5px; background: color-mix(in srgb, var(--accent) calc(var(--v) * 60%), transparent); }
  .best { font-weight: 600; box-shadow: inset 0 0 0 1px var(--fg); }
  .hn { color: var(--muted); text-align: right; font-family: var(--font-data); }
  .mx > div { text-align: center; line-height: 1.35; font-family: var(--font-data); font-size: 12.5px; }
  .mx .ph { color: var(--muted); text-align: left; font-family: var(--font-body); font-size: 13px; }
  .mx .win { background: color-mix(in srgb, var(--ok) 22%, transparent); }
  .mx .lose { background: color-mix(in srgb, var(--bad) 16%, transparent); }
  .mx .ns { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  .mx small { display: block; color: var(--muted); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .o-solved { --sw: var(--ok); } .o-patched_crash { --sw: var(--warn); } .o-vuln_no_crash { --sw: var(--none); }
  .o-no_poc { --sw: var(--line); } .o-infra { --sw: var(--bad); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { font-family: var(--font-data); font-size: 12.5px; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  th.l, td.l { text-align: left; }
  td.name { font-family: var(--font-body); font-size: 13px; }
  .chip { display: inline-block; min-width: 6.2em; text-align: center; padding: 1px 6px; border-radius: 999px; font-family: var(--font-body); font-size: 12px; background: color-mix(in srgb, var(--sw) 26%, transparent); }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); flex: 1 1 200px; max-width: 320px; min-width: 0; }
  .count { color: var(--muted); font-size: 12.5px; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 6px 9px; font-size: 12.5px; white-space: nowrap; z-index: 3; }
  .tip .tk { color: var(--muted); }
  footer { color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <p class="eyebrow">VEXED · exploit-verified vulnerability detection</p>
        <h1 data-t="title"></h1>
      </div>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
    </div>
    <p class="lede" id="lede"></p>
    <p class="meta" data-t="setup"></p>
  </header>

  <section class="tiles" id="tiles"></section>

  <div class="pair">
    <section class="card" id="overall">
      <h2 data-t="ciTitle"></h2>
      <p class="note" data-t="ciNote"></p>
      <div class="chart" id="ci-chart"></div>
    </section>
    <section class="card" id="pairwise">
      <h2 data-t="pairTitle"></h2>
      <p class="note" data-t="pairNote"></p>
      <div class="scroll"><div class="mx" id="pair"></div></div>
    </section>
  </div>

  <section class="card" id="breakdown">
    <h2 data-t="heatTitle"></h2>
    <p class="note" data-t="heatNote"></p>
    <div class="tabs" id="dims" role="group"></div>
    <div class="scroll"><div class="heat" id="heat"></div></div>
  </section>

  <div class="pair">
    <section class="card" id="failures">
      <h2 data-t="failTitle"></h2>
      <p class="note" data-t="failNote"></p>
      <ul class="legend" id="fail-legend"></ul>
      <div class="chart" id="fail-chart"></div>
    </section>
    <section class="card" id="overlap">
      <h2 data-t="kTitle"></h2>
      <p class="note" id="k-note"></p>
      <div class="chart" id="k-chart"></div>
      <table>
        <thead><tr><th class="l" data-t="colModel"></th><th data-t="colUnique"></th><th data-t="colOnlyMiss"></th></tr></thead>
        <tbody id="uniq"></tbody>
      </table>
    </section>
  </div>

  <section class="card" id="effort">
    <h2 data-t="effTitle"></h2>
    <p class="note" data-t="effNote"></p>
    <div class="scroll">
      <table>
        <thead><tr id="eff-head"></tr></thead>
        <tbody id="eff"></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="cves">
    <h2 data-t="cveTitle"></h2>
    <p class="note" data-t="cveNote"></p>
    <div class="tools">
      <div class="tabs" id="cve-filter" role="group"></div>
      <input id="search" class="search" type="search">
      <span class="count" id="cve-count"></span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr id="cve-head"></tr></thead>
        <tbody id="cve-rows"></tbody>
      </table>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

};
const state = { lang: 'en', dim: 'tier', filter: 'all', query: '' };
const T = () => I18N[state.lang];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function textWidth(svg, s) { const n = svg.append('text').text(s); const w = n.node().getComputedTextLength(); n.remove(); return w; }
function tooltip(box) {
  const t = el('div', 'tip'); t.hidden = true; box.appendChild(t);
  return {
    show(ev, title, lines) {
      t.replaceChildren(el('div', 'tk', title), ...lines.map((l) => el('div', null, l)));
      t.hidden = false;
      const b = box.getBoundingClientRect();
      let x = ev.clientX - b.left + 12;
      if (x + t.offsetWidth > box.clientWidth) x = Math.max(0, ev.clientX - b.left - t.offsetWidth - 12);
      t.style.left = x + 'px'; t.style.top = (ev.clientY - b.top + 12) + 'px';
    },
    hide() { t.hidden = true; },
  };
}

function drawText() {
  const t = T();
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  for (const n of document.querySelectorAll('[data-t]')) n.textContent = t[n.dataset.t];
  const ov = Object.fromEntries(D.overall.map((r) => [r.model, r]));
  const pr = D.pairwise.find((r) => r.model === MODELS[0] && r.versus === MODELS[1]);
  document.getElementById('lede').innerHTML = t.lede({ n: fmt.int(ov[MODELS[0]].n), a: ov[MODELS[0]].solved, b: ov[MODELS[1]].solved, p: fmt.p(pr.p) });
  const k0 = D.cves.filter((c) => c.models_solved === 0);
  document.getElementById('k-note').textContent = t.kNote({ hard: k0.length, cur: k0.filter((c) => c.curated_poc).length });
  document.getElementById('foot').textContent = t.foot(D.generated);
  document.getElementById('search').placeholder = t.search;
  document.getElementById('search').setAttribute('aria-label', t.search);
  for (const b of document.querySelectorAll('.switch button')) b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
}

    const h = el('h3'); const sw = el('span', 'sw'); sw.style.setProperty('--sw', MCOLOR[i]); h.append(sw, r.model);
    const fb = `${t.fallback} ${r.fallback_rows} ${t.rows}${r.fallback_solved ? ' ' + t.fbSolved(r.fallback_solved) : ''} · ${t.infra} ${r.infra_rows} ${t.rows}`;
    const sub = el('p', 'sub'); sub.append(`${r.solved} / ${r.n} ${t.solved} · 95% CI ${fmt.pct0(r.ci_low)}–${fmt.pct0(r.ci_high)}`, el('br'), fb);
    tile.append(h, el('p', 'big', fmt.pct(r.rate)), sub);
    return tile;
  }));
}

function drawCI() {
  const box = document.getElementById('ci-chart'); box.replaceChildren();
  const rows = D.overall, W = box.clientWidth || 400, rowH = 34, H = rows.length * rowH + 28;
  const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
  const left = d3.max(rows, (r) => textWidth(svg, r.model)) + 12, right = textWidth(svg, '100.0%') + 10;
  const x = d3.scaleLinear([Math.max(0, d3.min(rows, (r) => r.ci_low) - 0.03), Math.min(1, d3.max(rows, (r) => r.ci_high) + 0.03)], [left, W - right]).nice();
  const y = d3.scaleBand(rows.map((r) => r.model), [0, rows.length * rowH]).padding(0.3);
  const ax = svg.append('g').attr('transform', `translate(0,${rows.length * rowH})`)
    .call(d3.axisBottom(x).ticks(Math.max(2, Math.floor((W - left - right) / 70))).tickFormat(d3.format('.0%')).tickSizeOuter(0))
    .attr('font-size', null).attr('font-family', null);
  ax.select('.domain').style('stroke', 'var(--line)');
  ax.selectAll('.tick line').clone().attr('y2', -rows.length * rowH).style('stroke', 'var(--grid)');
  ax.selectAll('.tick line').style('stroke', 'var(--line)');
  const tip = tooltip(box);
  const g = svg.append('g').selectAll('g').data(rows).join('g').attr('transform', (r) => `translate(0,${y(r.model) + y.bandwidth() / 2})`);
  g.append('text').attr('x', left - 12).attr('dy', '0.32em').attr('text-anchor', 'end').attr('class', 'strong').text((r) => r.model);
  g.append('line').attr('x1', (r) => x(r.ci_low)).attr('x2', (r) => x(r.ci_high)).style('stroke', (_, i) => MCOLOR[i]).style('stroke-width', 3).style('stroke-linecap', 'round').style('opacity', 0.45);
  g.append('circle').attr('cx', (r) => x(r.rate)).attr('r', 6).style('fill', (_, i) => MCOLOR[i]);
  g.append('text').attr('x', (r) => x(r.ci_high) + 8).attr('dy', '0.32em').attr('class', 'strong').text((r) => fmt.pct(r.rate));
  g.append('rect').attr('x', left).attr('y', -rowH / 2).attr('width', W - left - right).attr('height', rowH).style('fill', 'transparent')
    .on('pointermove', (ev, r) => tip.show(ev, r.model, T().ciTip(r))).on('pointerleave', () => tip.hide());
}

function drawPair() {
  const box = document.getElementById('pair'); box.replaceChildren();
  box.style.gridTemplateColumns = `max-content repeat(${MODELS.length}, minmax(72px, 1fr))`;
  const add = (cls, text, sub) => { const c = el('div', cls, text); if (sub) c.appendChild(el('small', null, sub)); box.appendChild(c); };
  add('ph', ''); MODELS.forEach((m) => add('ph', m));
  for (const a of MODELS) {
    add('ph', a);
    for (const b of MODELS) {
      if (a === b) { add('', '—'); continue; }
      const r = D.pairwise.find((x) => x.model === a && x.versus === b);
      add(r.p < 0.05 ? (r.a_only > r.b_only ? 'win' : 'lose') : 'ns', `${r.a_only} : ${r.b_only}`, 'p ' + fmt.p(r.p));
    }
  }
}

function drawHeat() {
  const t = T();
  const tabs = document.getElementById('dims');
  tabs.setAttribute('aria-label', t.heatTitle);
  tabs.replaceChildren(...DIMS.map((d) => {
    const b = el('button', 'tab', t.dims[d]); b.type = 'button'; b.setAttribute('aria-pressed', String(d === state.dim));
    b.addEventListener('click', () => { state.dim = d; drawHeat(); });
    return b;
  }));
  const box = document.getElementById('heat'); box.replaceChildren();
  const rows = D.breakdown.filter((r) => r.dimension === state.dim);
  const groups = [...new Map(rows.map((r) => [r.group, r.n])).entries()];
  const order = { Easy: 0, Medium: 1, Hard: 2 };
  if (state.dim === 'difficulty') groups.sort((a, b) => order[a[0]] - order[b[0]]);
  else if (state.dim === 'published') groups.sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  else groups.sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  box.style.gridTemplateColumns = `minmax(110px, max-content) 44px repeat(${MODELS.length}, minmax(80px, 1fr))`;
  const add = (cls, text) => { const c = el('div', cls, text); box.appendChild(c); return c; };
  add('hh', t.group); add('hh hn', 'n'); MODELS.forEach((m) => { add('hh', m).style.textAlign = 'center'; });
  for (const [g, n] of groups) {
    add('', g); add('hn', fmt.int(n));
    const cells = MODELS.map((m) => rows.find((r) => r.group === g && r.model === m));
    const best = d3.max(cells, (r) => r.rate);
    for (const r of cells) {
      const c = add('hc' + (r.rate === best && best > 0 ? ' best' : ''), `${fmt.pct0(r.rate)} (${r.solved})`);
      c.style.setProperty('--v', r.rate);
    }
  }
}

function drawFail() {
  const t = T();
  document.getElementById('fail-legend').replaceChildren(...OUTCOMES.map((o) => { const li = el('li'); li.append(el('span', 'sw o-' + o), t.outcomeLong[o]); return li; }));
  const box = document.getElementById('fail-chart'); box.replaceChildren();
  const W = box.clientWidth || 400, rowH = 34, H = MODELS.length * rowH + 4;
  const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
  const left = d3.max(MODELS, (m) => textWidth(svg, m)) + 12;
  const y = d3.scaleBand(MODELS, [0, MODELS.length * rowH]).padding(0.28);
  const tip = tooltip(box);
  for (const m of MODELS) {
    const segs = OUTCOMES.map((o) => ({ o, n: (D.failures.find((r) => r.model === m && r.mode === o) || {}).count || 0 }));
    const total = d3.sum(segs, (s) => s.n) || 1;
    const x = d3.scaleLinear([0, total], [left, W]);
    svg.append('text').attr('x', left - 12).attr('y', y(m) + y.bandwidth() / 2).attr('dy', '0.32em').attr('text-anchor', 'end').attr('class', 'strong').text(m);
    let acc = 0;
    for (const s of segs) {
      if (!s.n) continue;
      const x0 = x(acc), w = x(acc + s.n) - x0;
      svg.append('rect').attr('x', x0).attr('y', y(m)).attr('width', Math.max(0, w - 1)).attr('height', y.bandwidth()).style('fill', OCOLOR[s.o])
        .on('pointermove', (ev) => tip.show(ev, m, [`${T().outcomeLong[s.o]}: ${s.n} (${fmt.pct0(s.n / total)})`])).on('pointerleave', () => tip.hide());
      if (w > 26) svg.append('text').attr('x', x0 + w / 2).attr('y', y(m) + y.bandwidth() / 2).attr('dy', '0.32em').attr('text-anchor', 'middle')
        .style('fill', s.o === 'solved' || s.o === 'infra' ? 'var(--panel)' : 'var(--fg)').style('pointer-events', 'none').text(s.n);
      acc += s.n;
    }
  }
}

function drawK() {
  const box = document.getElementById('k-chart'); box.replaceChildren();
  const rows = d3.range(MODELS.length + 1).map((k) => ({ k, n: D.cves.filter((c) => c.models_solved === k).length }));
  const W = box.clientWidth || 400, H = 180, top = 18, bottom = 30;
  const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
  const x = d3.scaleBand(rows.map((r) => String(r.k)), [0, W]).padding(0.3);
  const y = d3.scaleLinear([0, d3.max(rows, (r) => r.n)], [H - bottom, top]);
  svg.append('line').attr('x1', 0).attr('x2', W).attr('y1', H - bottom).attr('y2', H - bottom).style('stroke', 'var(--line)');
  const g = svg.selectAll('g.b').data(rows).join('g').attr('class', 'b');
  const bw = Math.min(32, x.bandwidth());
  g.append('rect').attr('x', (r) => x(String(r.k)) + (x.bandwidth() - bw) / 2).attr('width', bw).attr('y', (r) => y(r.n)).attr('height', (r) => H - bottom - y(r.n)).attr('rx', 3)
    .style('fill', (r) => (r.k === 0 ? 'var(--bad)' : 'var(--accent)'));
  g.append('text').attr('x', (r) => x(String(r.k)) + x.bandwidth() / 2).attr('y', (r) => y(r.n) - 5).attr('text-anchor', 'middle').attr('class', 'strong').text((r) => r.n);
  g.append('text').attr('x', (r) => x(String(r.k)) + x.bandwidth() / 2).attr('y', H - bottom + 16).attr('text-anchor', 'middle').text((r) => `k = ${r.k}`);
  document.getElementById('uniq').replaceChildren(...MODELS.map((m) => {
    const tr = el('tr');
    tr.append(el('td', 'l name', m),
      el('td', null, D.cves.filter((c) => c[m] === 'solved' && c.models_solved === 1).length),
      el('td', null, D.cves.filter((c) => c[m] !== 'solved' && c.models_solved === MODELS.length - 1).length));
    return tr;
  }));
}

function drawEffort() {
  const t = T();
  document.getElementById('eff-head').replaceChildren(...t.effCols.map((c, i) => el('th', i === 0 ? 'l' : null, c)));
  const f = (v, fm) => (v == null ? '—' : fm(v));
  document.getElementById('eff').replaceChildren(...MODELS.map((m) => D.effort.find((r) => r.model === m)).map((r) => {
    const tr = el('tr');
    tr.append(el('td', 'l name', r.model));
    for (const [v, fm] of [[r.wall_s_solved, fmt.s], [r.wall_s_unsolved, fmt.s], [r.turns_solved, fmt.s], [r.turns_unsolved, fmt.s],
      [r.out_tokens_solved, fmt.k], [r.out_tokens_unsolved, fmt.k], [r.timeouts, fmt.int], [r.total_out_tokens, fmt.m], [r.total_wall_hours, fmt.h]]) tr.append(el('td', null, f(v, fm)));
    return tr;
  }));
}

function drawCves() {
  const t = T(), n = MODELS.length;
  const fbox = document.getElementById('cve-filter');
  fbox.setAttribute('aria-label', t.cveTitle);
  fbox.replaceChildren(...Object.keys(t.filters).map((k) => {
    const b = el('button', 'tab', t.filters[k]); b.type = 'button'; b.setAttribute('aria-pressed', String(k === state.filter));
    b.addEventListener('click', () => { state.filter = k; drawCves(); });
    return b;
  }));
  document.getElementById('cve-head').replaceChildren(...t.cveCols.map((c, i) => el('th', i < 6 ? 'l' : null, c)));
  const q = state.query;
  const rows = D.cves.filter((r) => {
    const k = r.models_solved;
    if (state.filter === 'hard' && k !== 0) return false;
    if (state.filter === 'split' && (k === 0 || k === n)) return false;
    if (state.filter === 'easy' && k !== n) return false;
    return !q || [r.id, r.cve, r.project, r.cwe].some((v) => String(v).toLowerCase().includes(q));
  }).sort((a, b) => a.models_solved - b.models_solved || a.id.localeCompare(b.id, 'en', { numeric: true }));
  document.getElementById('cve-count').textContent = t.shown(rows.length, D.cves.length);
  document.getElementById('cve-rows').replaceChildren(...rows.map((r) => {
    const tr = el('tr');
    for (const k of ['id', 'cve', 'project', 'cwe', 'tier', 'difficulty']) tr.append(el('td', 'l', r[k] ?? '—'));
    for (const m of MODELS) { const td = el('td'); td.append(el('span', 'chip o-' + r[m], t.outcome[r[m]] || r[m])); tr.append(td); }
    tr.append(el('td', null, r.models_solved));
    return tr;
  }));
}

function drawAll() { drawText(); drawTiles(); drawCI(); drawPair(); drawHeat(); drawFail(); drawK(); drawEffort(); drawCves(); }

for (const b of document.querySelectorAll('.switch button')) b.addEventListener('click', () => { state.lang = b.dataset.lang; drawAll(); });
document.getElementById('search').addEventListener('input', (e) => { state.query = e.target.value.trim().toLowerCase(); drawCves(); });
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { drawCI(); drawFail(); drawK(); }, 120); });
if (navigator.language && navigator.language.toLowerCase().startsWith('zh') && !location.hash.includes('en')) state.lang = 'zh';
if (location.hash === '#zh') state.lang = 'zh';
if (location.hash === '#en') state.lang = 'en';
drawAll();
</script>
</body>
</html>
